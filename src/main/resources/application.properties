spring.application.name=Fiserv OPI Connector
app.version=1.0.0
app.release.date=10/05/2026
spring-boot.version=3.4.0

spring.config.import=file:./opiconnector.yaml

# Database Configuration
spring.datasource.url=jdbc:sqlite:opiconnector.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Properties (Spring Boot 3 / Hibernate 6 Native Dialect)
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect